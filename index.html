  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #e0f7fa, #f1f8e9);
      margin: 0;
      padding: 0;
      color: #333;
    }
    header {
      background: #4CAF50;
      color: white;
      padding: 20px;
      text-align: center;
    }
    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      font-weight: 600;
    }
    nav a:hover {
      text-decoration: underline;
    }
    h1 {
      margin: 0;
      font-size: 2em;
    }
    .worksheet-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin: 30px auto;
      max-width: 900px;
    }
    .worksheet {
      background: white;
      margin: 15px;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      width: 250px;
      transition: transform 0.2s;
    }
    .worksheet:hover {
      transform: translateY(-5px);
    }
    .worksheet h2 {
      font-size: 1.2em;
      margin-bottom: 10px;
    }
    .worksheet a {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 12px;
      background: #4CAF50;
      color: white;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
    }
    .worksheet a:hover {
      background: #388E3C;
    }
    footer {
      margin-top: 40px;
      padding: 15px;
      background: #eee;
      text-align: center;
      font-size: 0.9em;
    }
  </style>
</head>
